<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>猫哥 · 素材工作台</title><style>
:root{--ink:#153c38;--muted:#65736e;--line:#dfe5de;--bg:#f5f6f0;--green:#245c4d;--lime:#d8ec85}*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}.shell{display:grid;grid-template-columns:235px 1fr;min-height:100vh}aside{padding:30px 22px;border-right:1px solid var(--line);background:#edf1e8}h1{font-size:22px;margin:0 0 7px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted)}.logo{width:40px;height:40px;background:var(--green);color:var(--lime);display:grid;place-items:center;border-radius:12px;font-size:23px;margin-bottom:20px}.nav{margin-top:30px}.nav button,.cat{width:100%;border:0;background:none;text-align:left;padding:10px 12px;border-radius:7px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}.nav button.active,.cat.active{background:var(--green);color:white}.cat span:last-child{font-size:11px;opacity:.7}.cats{margin-top:14px;max-height:54vh;overflow:auto}.subtle{font-size:12px;line-height:1.7;color:var(--muted)}.sidefoot{border-top:1px solid var(--line);margin-top:20px;padding-top:14px}main{padding:32px 38px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}h2{font-size:29px;letter-spacing:-1px;margin:8px 0}.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:10px 14px;border-radius:8px}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:25px 0}.metric{border:1px solid var(--line);border-radius:12px;background:#fff;padding:18px}.metric b{display:block;font-size:30px;margin-top:8px}.metric.featured{background:var(--ink);color:var(--lime);border-color:var(--ink)}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 14px}input,select,textarea{border:1px solid #d4ddd3;border-radius:8px;background:white;color:var(--ink);padding:11px;outline:none}input:focus,textarea:focus{border-color:var(--green)}#search{flex:1;min-width:260px}#count{margin:14px 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;display:flex;flex-direction:column;min-height:205px}.card:hover{border-color:#8da395}.card h3{font-size:18px;line-height:1.4;margin:12px 0}.card p{font-size:12px;color:var(--muted);line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 15px}.badge{display:inline-block;width:max-content;padding:4px 8px;font-size:11px;background:#edf3e8;border-radius:4px;color:var(--green)}.badge.warn{background:#f7edd5;color:#927029}.cardfoot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid #edf0e9;font-size:12px}.link{border:0;background:none;color:var(--green);padding:0;font-weight:600}.record{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:10px;display:flex;gap:18px;align-items:center}.record .content{flex:1;min-width:0}.filename{font-weight:600;word-break:break-all;line-height:1.5}.record p{margin:5px 0;color:var(--muted);font-size:12px}.date{font-size:12px;min-width:75px}.pager{display:flex;justify-content:center;align-items:center;gap:20px;margin:28px}.empty{text-align:center;padding:50px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:16px;padding:0;width:min(880px,94vw);max-height:90vh;color:var(--ink);box-shadow:0 20px 90px #183f3430}dialog::backdrop{background:#193c3666}.dhead{display:flex;justify-content:space-between;align-items:flex-start;padding:25px 28px;background:#edf1e8}.dhead h2{font-size:24px;word-break:break-word}.dbody{padding:24px 28px}.appearance{border:1px solid var(--line);padding:18px;border-radius:10px;margin:12px 0}.appearance .buttons{margin-top:12px}.path{font:11px ui-monospace,monospace;word-break:break-all;color:var(--muted);background:var(--bg);padding:10px;border-radius:5px;margin-top:10px}.windows{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.time{padding:5px 8px;border:1px solid #bdd0bb;background:#f0f7ea;color:var(--green);border-radius:5px;font-size:12px}.notice{border-left:3px solid #b9cc76;padding:8px 12px;font-size:12px;line-height:1.7;color:var(--muted);margin-top:10px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formgrid label{display:flex;flex-direction:column;gap:7px;font-size:12px}.wide{grid-column:1/-1}textarea{min-height:80px}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:12px 20px;border-radius:8px;display:none;z-index:99}video{width:100%;max-height:62vh;background:#111;border-radius:8px}.status{margin-top:12px;font-size:11px;color:var(--muted)}@media(max-width:850px){.shell{grid-template-columns:1fr}aside{padding:15px 20px}.logo,.cats,.sidefoot,.eyebrow{display:none}.nav{display:flex;margin-top:10px}.nav button{width:auto}main{padding:20px}.metrics{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}.record{flex-wrap:wrap}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}

.viewcontrols{display:flex;align-items:center;gap:12px;justify-content:flex-end;margin:12px 0}.viewsegments{display:flex;background:#e7ece3;border-radius:8px;padding:3px}.viewsegments button{background:transparent;border:0;border-radius:6px;padding:8px 13px;color:var(--muted);cursor:pointer}.viewsegments .active{background:var(--green);color:#fff}#batchBar{display:none;align-items:center;flex-wrap:wrap;gap:8px;padding:14px;border:1px solid #b4c59e;background:#edf4df;border-radius:10px;margin:16px 0;position:sticky;top:0;z-index:5}.batchdivider{height:22px;border-left:1px solid #c6d1bc;margin:0 5px}#bulkCategory{width:170px}.batchSelector{display:inline-flex;align-items:center;gap:5px;color:var(--green);font-size:12px}.card>.batchSelector{margin-bottom:10px}.batchCheck{width:17px;height:17px;accent-color:var(--green);cursor:pointer}.hidden{display:none!important}.danger{color:#a14d3a!important;border-color:#e5c8c0}.productListRow{display:flex;align-items:center;gap:16px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:15px;margin-bottom:10px}.smallPicture{width:70px;height:70px;flex-shrink:0;display:grid;place-items:center;background:#f0f3ec;border-radius:7px;overflow:hidden}.smallPicture img{width:100%;height:100%;object-fit:contain}.smallPicture span{font-size:11px}.listInfo{flex:1;min-width:0}.listInfo h3{font-size:16px;margin:0 0 7px}.listInfo p{margin:7px 0 0;color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}.tableWrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}.productTable{border-collapse:collapse;width:100%;min-width:820px;text-align:left;font-size:12px}.productTable th{background:#edf1e8;font-weight:600;padding:14px}.productTable td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}.productTable tr:hover{background:#f7faf2}.tableProduct{display:flex;align-items:center;gap:12px;min-width:260px;max-width:420px;line-height:1.6}.productTable .btn{font-size:12px;padding:7px 9px}.productTable .batchSelector span{display:none}@media(max-width:850px){.viewcontrols{justify-content:flex-start}.productListRow{flex-wrap:wrap}.listInfo{min-width:180px}.productListRow>.buttons{margin-left:auto}#batchBar{position:static}.viewsegments button{padding:8px 10px}}
</style><link rel="stylesheet" href="corner-theme.css"></head><body><div class="shell"><aside><div class="logo">猫</div><h1>猫哥素材库</h1><div class="eyebrow">FOOTAGE WORKBENCH</div><div class="nav"><button data-view="products" class="active">产品查询 <span>→</span></button><button data-view="recordings">素材查询 <span>→</span></button><button data-view="pending">待补充 <span id="pendingnum"></span></button></div><div class="cats" id="cats"></div><div class="sidefoot subtle">素材盘与已有分析只读。<br>更新、备注保存在本任务目录。<div class="status" id="mode"></div></div><div class="sideFriends" aria-hidden="true"></div></aside><main><header class="top"><div><div class="eyebrow">猫哥评测 · 2026 年 7 月起</div><h2 id="heading">找到产品，定位素材</h2><div class="subtle">按产品、型号、分类或素材名称搜索，再打开对应回放。</div></div><div class="buttons"><button class="btn" id="export">导出索引</button><button class="btn" id="refresh">更新索引</button><button class="btn primary" id="add">＋ 补充记录</button></div></header><section class="cornerHero" aria-label="角落素材小屋"><div class="cornerHeroText"><span class="tiny">A LITTLE COZY CORNER</span><h3>在小角落里<br>找到好素材</h3><p>把每一次好灵感，轻轻收好。</p></div><img src="corner-friends.svg" alt="奶油色小熊、绿色企鹅、米色小猫、蓝色小蜥蜴与小伙伴"></section><section class="metrics" id="metrics"></section><div class="notice" id="message">时间段用于回查定位，不代表可以直接作为成片切点。型号待核的记录保留原名称。</div><div class="bar"><input id="search" placeholder="搜索产品、分类、型号或素材日期…"><select id="month"><option value="">全部月份</option></select><select id="kind"><option value="">全部素材</option><option>原始回放</option><option>已有切片</option></select><select id="timing"><option value="">全部时间段</option><option value="yes">有回查时间段</option></select></div><div id="count"></div><div id="results"></div><div class="pager"><button class="btn" id="prev">上一页</button><span id="page"></span><button class="btn" id="next">下一页</button></div><div class="subtle" id="updated"></div></main></div><dialog id="detail"><div class="dhead"><div><span class="badge" id="dcat"></span><h2 id="dtitle"></h2></div><button class="btn close">关闭</button></div><div class="dbody" id="dbody"></div></dialog><dialog id="form"><div class="dhead"><div><div class="eyebrow">记录补充 · 原素材不会被修改</div><h2>添加产品与素材关联</h2></div><button class="btn close">关闭</button></div><form class="dbody" id="editor"><div class="formgrid"><label class="wide">素材文件<select id="fsource" required></select></label><label>产品名称<input id="fname" placeholder="仅写能确定的产品名；不确定型号注明待核"></label><label>产品分类<input id="fcat" list="categorylist" value="其他 / 待分类"><datalist id="categorylist"></datalist></label><label>开始时间（秒，可不填）<input id="fstart" type="number" min="0" step="0.01"></label><label>结束时间（秒，可不填）<input id="fend" type="number" min="0" step="0.01"></label><label class="wide">产品描述<textarea id="fdesc" placeholder="这段有哪些展示或讲解"></textarea></label><label class="wide">素材备注<textarea id="fnote" placeholder="整条素材的补充信息"></textarea></label></div><div class="notice" id="formnotice"></div><div class="buttons" style="margin-top:20px"><button class="btn primary" type="submit">保存补充</button></div></form></dialog><dialog id="player"><div class="dhead"><h2 id="ptitle">素材预览</h2><button class="btn close">关闭</button></div><div class="dbody"><video id="video" controls preload="metadata"></video><p class="subtle">原文件直接读取，不复制、不转码。若编码无法播放，可复制路径用本地播放器打开。</p></div></dialog><div class="toast" id="toast"></div><script src="catalog-data.js"></script><script>
function productPreviewName(p){return p?.product_url&&p.link_name?.trim()?p.link_name.trim():(p?.name||'')}
let data=window.BASE_INDEX,online=false,view='products',cat='',page=1,items=[],records={},productMap={};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let timer;function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('#toast').style.display='none',3000)}function hms(v){v=Math.floor(v);return [Math.floor(v/3600),Math.floor(v%3600/60),v%60].map(n=>String(n).padStart(2,'0')).join(':')}
function initialize(){records=Object.fromEntries(data.recordings.map(r=>[r.id,r]));productMap=Object.fromEntries(data.products.map(p=>[p.id,p]));let cats={};data.products.forEach(p=>cats[p.category]=(cats[p.category]||0)+1);$('#cats').innerHTML='<button class="cat '+(!cat?'active':'')+'" data-cat="">全部产品 <span>'+data.products.length+'</span></button>'+Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,n])=>'<button class="cat '+(cat===c?'active':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'<span>'+n+'</span></button>').join('');$('#categorylist').innerHTML=Object.keys(cats).map(c=>'<option value="'+esc(c)+'">').join('');const month=$('#month').value;$('#month').innerHTML='<option value="">全部月份</option>'+[...new Set(data.recordings.map(r=>r.date.slice(0,7)))].sort().reverse().map(m=>'<option>'+m+'</option>').join('');$('#month').value=month;$('#metrics').innerHTML=[['可查询产品记录',data.products.length],['原始回放',data.stats.raw_recordings],['已有切片',data.stats.slices],['原始回放已关联',data.stats.raw_with_products+' / '+data.stats.raw_recordings]].map(([a,b],i)=>'<div class="metric '+(i===0?'featured':'')+'">'+a+'<b>'+b+'</b></div>').join('');$('#pendingnum').textContent=data.recordings.filter(r=>!r.product_ids.length).length;$('#mode').textContent=online?'本地服务已连接 · 可保存更新':'离线查询模式';$('#updated').textContent='索引更新：'+new Date(data.updated_at).toLocaleString('zh-CN')+' · 来源：'+data.source_root;$('#message').textContent=online?'时间段用于回查定位，剪辑前核对原音与画面。产品目录和分析记录保守区分，不自动合并不确定型号。':'当前可以直接搜索。需要更新、保存补充或播放素材时，双击任务目录中的「启动工作台.command」，在本地页面操作。';render()}
function sourceMatch(r){return (!$('#month').value||r.date.startsWith($('#month').value))&&(!$('#kind').value||r.kind===$('#kind').value)}function render(){let words=$('#search').value.toLowerCase().trim().split(/\s+/).filter(Boolean),timed=$('#timing').value==='yes';if(view==='products'){items=data.products.map(p=>({...p,filtered:p.appearances.filter(a=>{const r=records[a.recording_id];return r&&sourceMatch(r)&&(!timed||a.windows.length)})})).filter(p=>p.filtered.length&&(!cat||p.category===cat)&&words.every(w=>[p.name,p.link_name||'',p.category,...p.aliases,p.description,...p.filtered.map(a=>records[a.recording_id].name)].join(' ').toLowerCase().includes(w)));items.sort((a,b)=>Math.max(...b.filtered.map(x=>+records[x.recording_id].date.replaceAll('-','')))-Math.max(...a.filtered.map(x=>+records[x.recording_id].date.replaceAll('-',''))));}else{items=data.recordings.filter(r=>sourceMatch(r)&&(view!=='pending'||!r.product_ids.length)&&(!timed||r.analysis.some(a=>a.windows.length))&&(!cat||r.product_ids.some(id=>productMap[id]?.category===cat))&&words.every(w=>[r.name,r.date,r.note||'',...r.product_ids.map(id=>productMap[id]?.name||''),...r.analysis.map(a=>a.name)].join(' ').toLowerCase().includes(w)))}const total=Math.max(1,Math.ceil(items.length/24));page=Math.min(page,total);$('#count').textContent=(view==='products'?'产品记录':'素材文件')+' · '+items.length+' 条结果'+(cat?' · '+cat:'');$('#heading').textContent=view==='products'?'找到产品，定位素材':view==='pending'?'待补充产品的回放':'每条回放，都有入口';const visible=items.slice((page-1)*24,page*24);$('#results').className=view==='products'?'grid':'';$('#results').innerHTML=visible.length?visible.map(x=>view==='products'?'<article class="card"><span class="badge">'+esc(x.category)+'</span><h3>'+esc(productPreviewName(x))+'</h3><p>'+esc(x.description||x.aliases.join(' / '))+'</p><div class="cardfoot"><span>'+new Set(x.filtered.map(a=>a.recording_id)).size+' 条素材'+(x.filtered.some(a=>a.windows.length)?' · 有时间段':'')+'</span><button class="link" data-product="'+esc(x.id)+'">查看素材 ↗</button></div></article>':'<article class="record"><div class="date">'+esc(x.date)+'<br><span class="subtle">'+esc(x.kind)+'</span></div><div class="content"><div class="filename">'+esc(x.name)+'</div><p>'+esc([...new Set(x.product_ids.map(id=>productMap[id]?.category).filter(Boolean))].join(' / ')||'暂无产品关联')+'</p><span class="badge '+(!x.product_ids.length?'warn':'')+'">'+esc(x.status)+'</span></div><button class="btn" data-record="'+x.id+'">查看详情</button></article>').join(''):'<div class="empty">没有找到。试试产品类别或更短的关键词，也可以补充产品记录。</div>';$('#page').textContent=page+' / '+total;$('#prev').disabled=page<=1;$('#next').disabled=page>=total}
function appearance(a){let r=records[a.recording_id];return '<section class="appearance"><div class="subtle">'+esc(r.date)+' · '+esc(r.kind)+' · '+esc(a.basis)+'</div><div class="filename">'+esc(r.name)+'</div><div class="windows">'+(a.windows.length?a.windows.map(w=>'<button class="time" data-play="'+r.id+'" data-start="'+w[0]+'">'+hms(w[0])+' — '+hms(w[1])+' ▷</button>').join(''):'<span class="subtle">暂无确定回查时间段 · 查看素材详情中的原始分析</span>')+'</div>'+((a.visual_identity||(a.source_records||[]).find(x=>x.visual_identity)?.visual_identity)?'<p class="subtle">外观依据：'+esc(a.visual_identity||(a.source_records||[]).find(x=>x.visual_identity)?.visual_identity)+'</p>':'')+'<div class="path">'+esc(r.path)+'</div><div class="buttons"><button class="btn" data-copy="'+esc(r.path)+'">复制路径</button><button class="btn" data-record="'+r.id+'">查看本条所有产品</button><button class="btn" data-play="'+r.id+'" data-start="0">预览回放</button></div></section>'}
function showProduct(id){let p=productMap[id];$('#dtitle').textContent=productPreviewName(p);$('#dcat').textContent=p.category;$('#dbody').innerHTML='<p class="subtle">'+esc(p.description)+'</p>'+p.appearances.filter(a=>sourceMatch(records[a.recording_id])).sort((a,b)=>records[b.recording_id].date.localeCompare(records[a.recording_id].date)).map(appearance).join('')+'<div class="notice">'+esc(p.cautions.join('；'))+'</div><div class="path">证据来源：'+esc(p.evidence)+'</div>';if(!$('#detail').open)$('#detail').showModal()}
function showRecord(id){let r=records[id];$('#dtitle').textContent=r.name;$('#dcat').textContent=r.kind;$('#dbody').innerHTML='<div class="subtle">'+esc(r.date)+' · '+esc(r.status)+' · '+(r.bytes/1024**3).toFixed(2)+' GB</div><div class="path">'+esc(r.path)+'</div><div class="buttons" style="margin:15px 0"><button class="btn" data-copy="'+esc(r.path)+'">复制路径</button><button class="btn" data-play="'+id+'" data-start="0">预览回放</button><button class="btn" data-edit="'+id+'">补充本条记录</button></div><h3>关联产品</h3>'+r.product_ids.map(pid=>'<button class="time" data-product="'+pid+'">'+esc(productMap[pid]?.name||pid)+'</button>').join(' ')+'<h3>已有分析与回查时间段</h3>'+(r.analysis.length?r.analysis.map(x=>'<section class="appearance"><div class="filename">'+esc(x.name)+'</div><p class="subtle">'+esc(x.description)+'</p><div class="windows">'+x.windows.map(w=>'<button class="time" data-play="'+id+'" data-start="'+w[0]+'">'+hms(w[0])+' — '+hms(w[1])+' ▷</button>').join('')+'</div><div class="path">'+esc(x.evidence)+'</div></section>').join(''):'<div class="notice">还没有可用的产品时间段分析。可手动补充，不猜测型号。</div>')+(r.note?'<h3>素材备注</h3><p class="subtle">'+esc(r.note)+'</p>':'');if(!$('#detail').open)$('#detail').showModal()}
function edit(rid){$('#editor').reset();$('#fsource').innerHTML=data.recordings.map(r=>'<option value="'+r.id+'">'+esc(r.date+' · '+r.name)+'</option>').join('');if(rid)$('#fsource').value=rid;$('#fnote').value=records[$('#fsource').value]?.note||'';$('#formnotice').textContent=online?'保存到「数据/手动补充.json」。更新索引会保留这些补充。':'请先双击「启动工作台.command」再补充，这样内容会保存到本地文件。';$('#editor button[type=submit]').disabled=!online;$('#form').showModal()}
async function request(path,body){let res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),v=await res.json();if(!res.ok)throw Error(v.error||'保存失败');return v}
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.classList.contains('close')){const d=b.closest('dialog');if(d.id==='player'){$('#video').pause();$('#video').removeAttribute('src');$('#video').load()}d.close()}if(b.dataset.view){view=b.dataset.view;page=1;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render()}if(b.dataset.cat!==undefined){cat=b.dataset.cat;page=1;initialize()}if(b.dataset.product)showProduct(b.dataset.product);if(b.dataset.record)showRecord(b.dataset.record);if(b.dataset.edit)edit(b.dataset.edit);if(b.dataset.copy){try{await navigator.clipboard.writeText(b.dataset.copy);toast('路径已复制')}catch{prompt('复制素材路径',b.dataset.copy)}}if(b.dataset.play){if(!online)return toast('预览需要启动本地工作台服务');let r=records[b.dataset.play];$('#ptitle').textContent=r.name;$('#video').src='/media?id='+encodeURIComponent(r.id);$('#video').onloadedmetadata=()=>{$('#video').currentTime=Number(b.dataset.start)||0};$('#player').showModal()}});
$('#add').onclick=()=>edit();$('#fsource').onchange=()=>$('#fnote').value=records[$('#fsource').value]?.note||'';$('#editor').onsubmit=async e=>{e.preventDefault();let b=$('#editor button[type=submit]');b.disabled=true;try{data=await request('/api/save',{recording_id:$('#fsource').value,name:$('#fname').value,category:$('#fcat').value,start:$('#fstart').value,end:$('#fend').value,description:$('#fdesc').value,note:$('#fnote').value,image_data:await imageData($('#fimage')),shop_url:$('#fshop').value});initialize();$('#form').close();toast('补充已保存到本地文件')}catch(err){toast(err.message)}finally{b.disabled=!online}};$('#refresh').onclick=async()=>{if(!online)return toast('请双击「更新索引.command」，或启动工作台后点击更新');let b=$('#refresh');b.disabled=true;b.textContent='读取素材与分析中…';try{data=await request('/api/refresh',{});initialize();toast('索引已更新，手动补充已保留')}catch(e){toast(e.message)}finally{b.disabled=false;b.textContent='更新索引'}};$('#export').onclick=async()=>{if(!online)return toast('导出需要启动工作台，文件会保存到本任务的 数据/导出');try{let r=await request('/api/export',{});toast('导出已保存到 数据/导出');prompt('索引已保存，路径如下',r.path)}catch(e){toast(e.message)}};['search','month','kind','timing'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',()=>{page=1;render()}));$('#prev').onclick=()=>{page--;render()};$('#next').onclick=()=>{page++;render();window.scrollTo({top:0,behavior:'smooth'})};initialize();if(location.protocol.startsWith('http'))fetch('/api/index').then(r=>{if(!r.ok)throw Error();return r.json()}).then(v=>{data=v;online=true;initialize()}).catch(()=>toast('本地服务未连接，使用离线索引'));
</script><script src="product-media.js"></script><script src="product-delete.js"></script><script src="bulk-views.js"></script><script src="product-verification.js"></script><script src="product-merge-info.js"></script></body></html>
